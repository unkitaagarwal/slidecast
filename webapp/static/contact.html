<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — The SlideCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0a0807;
  --card:   rgba(255,247,232,0.05);
  --border: rgba(255,247,232,0.12);
  --accent: #ff5c7a;
  --accentH:#ff89a3;
  --text:   #fbf6ec;
  --muted:  #aea394;
  --sans:   'Plus Jakarta Sans', system-ui, sans-serif;
  --serif:  'Fraunces', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}

/* Nav */
nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 36px; height: 60px;
  background: rgba(10,8,7,0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-brand {
  font-family: var(--serif); font-size: 1.15rem; font-weight: 600;
  color: var(--text); text-decoration: none;
}
.nav-brand em { font-style: italic; font-weight: 400; opacity: .75; }
.nav-links { display: flex; align-items: center; gap: 24px; }
.nav-links a {
  font-size: 14px; font-weight: 500; color: var(--muted);
  text-decoration: none; transition: color .15s;
}
.nav-links a:hover { color: var(--text); }

/* Page */
.container { max-width: 680px; margin: 0 auto; padding: 60px 28px 100px; }
h1 {
  font-family: var(--serif); font-weight: 600;
  font-size: clamp(28px, 4vw, 44px); line-height: 1.1;
  letter-spacing: -0.02em; margin-bottom: 10px;
}
h1 em {
  font-style: italic; font-weight: 400;
  background: linear-gradient(180deg, #f4c47a 0%, #ff5c7a 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 36px; }

/* Form */
.form-group { margin-bottom: 20px; }
.form-label {
  display: block; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 7px;
}
.form-input, .form-textarea {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text); font-size: 14px;
  padding: 12px 16px; outline: none; font-family: var(--sans);
  transition: border-color .2s;
}
.form-input:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 140px; line-height: 1.5; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }

.btn-submit {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(180deg, #fff 0%, #fbe7d0 100%);
  color: #1a0c0e; border: none; border-radius: 999px;
  padding: 13px 28px; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: var(--sans);
  box-shadow: 0 8px 24px -6px rgba(255,92,122,.4);
  transition: transform .15s, box-shadow .15s;
}
.btn-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 12px 30px -6px rgba(255,92,122,.55);
}
.btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.success-msg {
  display: none; padding: 16px 20px; border-radius: 12px;
  background: rgba(102,201,146,.1); border: 1px solid rgba(102,201,146,.3);
  color: #66c992; font-size: 14px; font-weight: 600; margin-top: 16px;
}
.error-msg {
  display: none; padding: 16px 20px; border-radius: 12px;
  background: rgba(232,96,122,.1); border: 1px solid rgba(232,96,122,.3);
  color: #e8607a; font-size: 14px; margin-top: 16px;
}

/* Info cards */
.info-cards { margin-top: 20px; }
.info-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 20px;
  display: flex; align-items: center; gap: 10px;
}
.info-card h3 { font-size: 14px; font-weight: 700; white-space: nowrap; margin: 0; }
.info-card p { font-size: 13px; color: var(--muted); margin: 0; }
.info-card a { color: var(--accent); text-decoration: none; }
.info-card a:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">The <em>SlideCast</em></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/scheduler">Scheduler</a>
    <a href="/#pricing">Pricing</a>
  </div>
</nav>

<div class="container">
  <h1>Get in <em>touch.</em></h1>
  <p class="subtitle">Have a question, feature request, or need help with your account? Drop us a message and we'll get back to you within 24 hours.</p>

  <form id="contactForm" onsubmit="return handleSubmit(event)">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="name">Name</label>
        <input class="form-input" type="text" id="name" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="subject">Subject</label>
      <input class="form-input" type="text" id="subject" placeholder="What's this about?">
    </div>
    <div class="form-group">
      <label class="form-label" for="message">Message</label>
      <textarea class="form-textarea" id="message" placeholder="Tell us how we can help…" required></textarea>
    </div>
    <button class="btn-submit" type="submit" id="submitBtn">
      Send message
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </button>
  </form>

  <div class="success-msg" id="successMsg">Message sent! We'll get back to you soon.</div>
  <div class="error-msg" id="errorMsg"></div>

  <div class="info-cards">
    <div class="info-card">
      <h3>Response time</h3>
      <p>We typically reply within 24 hours on business days.</p>
    </div>
  </div>
</div>

<script>
async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const successMsg = document.getElementById('successMsg');
  const errorMsg = document.getElementById('errorMsg');
  successMsg.style.display = 'none';
  errorMsg.style.display = 'none';

  const data = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    subject: document.getElementById('subject').value.trim(),
    message: document.getElementById('message').value.trim(),
  };

  if (!data.name || !data.email || !data.message) {
    errorMsg.textContent = 'Please fill in all required fields.';
    errorMsg.style.display = 'block';
    return false;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error(t || 'Something went wrong');
    }
    successMsg.style.display = 'block';
    document.getElementById('contactForm').reset();
  } catch (err) {
    errorMsg.textContent = err.message || 'Failed to send. Please email us directly.';
    errorMsg.style.display = 'block';
  }

  btn.disabled = false;
  btn.innerHTML = 'Send message <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
  return false;
}
</script>

</body>
</html>
