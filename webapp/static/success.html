<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — SlideCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0807; --accent: #ff5c7a; --text: #fbf6ec; --muted: #aea394;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --serif: 'Fraunces', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px; -webkit-font-smoothing: antialiased;
}
.card {
  text-align: center; max-width: 440px;
  background: rgba(255,247,232,0.05);
  border: 1px solid rgba(255,247,232,0.12);
  border-radius: 24px; padding: 56px 40px;
}
.icon {
  width: 64px; height: 64px; background: rgba(102,201,146,0.15);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 28px; color: #66c992;
}
h1 { font-family: var(--serif); font-size: 2rem; font-weight: 600; margin-bottom: 12px; }
p { color: var(--muted); line-height: 1.6; margin-bottom: 32px; }
a {
  display: inline-block; background: var(--accent); color: #fff;
  padding: 14px 32px; border-radius: 12px; text-decoration: none;
  font-weight: 700; font-size: 0.95rem;
  transition: opacity 0.15s;
}
a:hover { opacity: 0.88; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>
  <h1>You're all set!</h1>
  <p>Your subscription is active. You now have full access to SlideCast — start generating and scheduling posts.</p>
  <a href="/">Go to the app →</a>
</div>
</body>
</html>
