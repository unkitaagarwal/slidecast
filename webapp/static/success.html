<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — The SlideCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0807; --accent: #ff5c7a; --text: #fbf6ec; --muted: #aea394;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --serif: 'Fraunces', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
/* ── Top nav (same shape as the home page) ───────────────────────────────── */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 32px; border-bottom: 1px solid rgba(255,247,232,0.08);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  color: var(--text); text-decoration: none;
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, #ff5c7a 0%, #f4c47a 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.brand-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
.brand-name em { font-style: italic; font-weight: 400; opacity: 0.85; }
.nav-right { display: flex; align-items: center; gap: 14px; min-height: 36px; }
#nav-user-slot { display: flex; align-items: center; gap: 10px; }

/* ── Centered success card ──────────────────────────────────────────────── */
.center-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card {
  text-align: center; max-width: 480px; width: 100%;
  background: rgba(255,247,232,0.04);
  border: 1px solid rgba(255,247,232,0.12);
  border-radius: 24px; padding: 56px 40px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}
.icon {
  width: 68px; height: 68px; background: rgba(102,201,146,0.15);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px; color: #66c992;
}
h1 { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em; }
.sub { color: var(--muted); line-height: 1.6; margin-bottom: 14px; font-size: 1rem; }
.plan-line {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 0 auto 24px; padding: 6px 14px;
  background: rgba(255,92,122,0.12); border: 1px solid rgba(255,92,122,0.35);
  border-radius: 999px; font-size: 0.85rem; color: var(--text); font-weight: 600;
}
.plan-line .dot { width: 8px; height: 8px; border-radius: 50%; background: #66c992; }
.cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: #fff;
  padding: 14px 28px; border-radius: 999px; text-decoration: none;
  font-weight: 700; font-size: 0.95rem;
  transition: opacity 0.15s, transform 0.15s;
}
.cta:hover { opacity: 0.9; transform: translateY(-1px); }
.cta[aria-disabled="true"] {
  pointer-events: none; opacity: 0.55; transform: none;
}
.status-row {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; color: var(--muted); font-size: 0.85rem; margin-top: 18px;
  min-height: 24px;
}
.spin {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,247,232,0.18);
  border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.status-row.ok { color: #66c992; }
</style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M6 4h10a4 4 0 014 4v12H6a2 2 0 01-2-2V6a2 2 0 012-2z" stroke="currentColor" stroke-width="2"/>
          <path d="M9 10l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name">The <em>SlideCast</em></span>
    </a>
    <div class="nav-right">
      <div id="nav-user-slot"></div>
    </div>
  </header>

  <div class="center-wrap">
    <div class="card">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h1>You're all set!</h1>
      <p class="sub">Your subscription is now active. Full access unlocked.</p>
      <div class="plan-line" id="plan-line" style="display:none">
        <span class="dot"></span>
        <span id="plan-label">Active plan</span>
      </div>
      <div>
        <a class="cta" id="cta-go" href="/" aria-disabled="true">
          <span class="spin" id="cta-spin"></span>
          <span id="cta-text">Activating your account…</span>
        </a>
      </div>
      <div class="status-row" id="status-row">
        <span>Waiting for Stripe to confirm…</span>
      </div>
    </div>
  </div>

  <!-- Brand nav (renders email + Logout into #nav-user-slot, same as home) -->
  <script type="module" src="/static/firebase-nav.js?v=__BUILD_ID__"></script>

  <!-- Plan-activation poller — waits for the webhook to propagate -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Same project config used by firebase-nav.js — keep in sync.
    const firebaseConfig = {
      apiKey:            "AIzaSyANRIcHZsiB-nX2NebAeh_RVbC7I_K6u84",
      authDomain:        "slidecast-75f5c.firebaseapp.com",
      projectId:         "slidecast-75f5c",
      storageBucket:     "slidecast-75f5c.firebasestorage.app",
      messagingSenderId: "829361595060",
      appId:             "1:829361595060:web:31526e2f798ee8aba6ede1",
    };
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const ctaBtn    = document.getElementById("cta-go");
    const ctaText   = document.getElementById("cta-text");
    const ctaSpin   = document.getElementById("cta-spin");
    const statusRow = document.getElementById("status-row");
    const planLine  = document.getElementById("plan-line");
    const planLabel = document.getElementById("plan-label");

    function showConfirmed(planName) {
      // Mirror what firebase-nav.js writes so the home page reads it cleanly
      const cur = JSON.parse(localStorage.getItem("sc_user") || "{}");
      cur.plan = planName;
      localStorage.setItem("sc_user", JSON.stringify(cur));

      planLabel.textContent = `${planName.toUpperCase()} plan · active`;
      planLine.style.display = "inline-flex";
      ctaSpin.style.display  = "none";
      ctaText.textContent    = "Taking you in…";
      statusRow.classList.add("ok");
      statusRow.innerHTML = `<span>✓ Subscription confirmed — redirecting…</span>`;
    }

    function redirectHome() {
      // Replace history so the back button doesn't bring the user back to /success
      window.location.replace("/");
    }

    async function checkPlan(email) {
      try {
        let snap = await getDoc(doc(db, "users", email));
        if (!snap.exists()) return null;
        const d = snap.data();
        const active = d.plan && d.plan !== "" && d.status === "active";
        return active ? d.plan : null;
      } catch (e) {
        console.warn("plan lookup failed:", e);
        return null;
      }
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        // Edge case: someone paid without a Firebase session. Send them to
        // /auth so they can sign in (or sign up with the same email Stripe
        // captured), then they'll be unlocked.
        statusRow.innerHTML = `<span>Sign in to access your subscription…</span>`;
        setTimeout(() => window.location.replace("/auth?redirect=%2F"), 800);
        return;
      }
      // Poll Firestore for the plan flip from the webhook (up to ~20 seconds)
      for (let attempt = 0; attempt < 10; attempt++) {
        const planName = await checkPlan(user.email);
        if (planName) {
          showConfirmed(planName);
          // Brief pause so the user sees the green confirmation before
          // we send them to the home page.
          setTimeout(redirectHome, 800);
          return;
        }
        await new Promise(r => setTimeout(r, 2000));
      }
      // Webhook didn't land in 20s — still send the user home. The home page
      // does its own plan check and the next Firestore listener tick will
      // pick up the activation when the webhook eventually arrives.
      statusRow.innerHTML = `<span>Still syncing — taking you in anyway. Refresh in a moment if features look gated.</span>`;
      setTimeout(redirectHome, 1500);
    });
  </script>
</body>
</html>
